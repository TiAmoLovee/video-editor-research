name: ClipForge checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-worker.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-worker.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Check Python errors with Ruff
        run: python -m ruff check --no-cache --output-format=github .
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
